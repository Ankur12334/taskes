<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Habit Tracker</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <!-- TOP HEADER -->

    <div class="top">

      <div class="month-section">

        <h1 class="month" id="monthTitle">
          Current Month
        </h1>

        <p class="subtitle">
          Build consistency. Track your life.
        </p>

      </div>

      <div class="stats">

        <div class="card">

          <h3>Total Habits</h3>

          <p id="totalHabits">
            0
          </p>

        </div>

        <div class="card">

          <h3>Completed</h3>

          <p id="completedHabits">
            0
          </p>

        </div>

        <div class="card">

          <h3>Progress</h3>

          <p id="progressText">
            0%
          </p>

        </div>

        <div class="card">

          <h3>Level</h3>

          <p id="levelText">
            Beginner
          </p>

        </div>

      </div>

    </div>

    <!-- CONTROL BUTTONS -->

    <div class="controls">

      <button onclick="toggleDarkMode()">
        <span class="icon">🌓</span> Dark Mode
      </button>

      <button onclick="resetAll()">
        <span class="icon">🔄</span> Reset Progress
      </button>

      <button onclick="exportData()">
        <span class="icon">⬇️</span> Export Data
      </button>

      <input type="file" id="importInput" accept=".json" style="display: none;" onchange="importData(event)">
      <button onclick="document.getElementById('importInput').click()">
        <span class="icon">⬆️</span> Import Data
      </button>

    </div>

    <!-- ADD HABIT -->

    <div class="add-habit">

      <input
        type="text"
        id="habitInput"
        placeholder="Add new habit..."
      >

      <button onclick="addHabit()">
        Add Habit
      </button>

    </div>

    <!-- HABIT TABLE -->

    <div class="tracker">

      <table id="habitTable">

        <thead>

          <tr id="tableHeaderRow">

            <th class="habit-name">
              My Habits
            </th>

          </tr>

        </thead>

        <tbody>

        </tbody>

      </table>

    </div>

    <!-- PROGRESS SECTION -->

    <div class="progress-section">

      <div class="progress-header">

        <h2 class="progress-title">
          Monthly Progress
        </h2>

        <span id="percentage">
          0% Completed
        </span>

      </div>

      <div class="progress-bar">

        <div
          class="progress-fill"
          id="progressFill"
        ></div>

      </div>

    </div>

    <!-- MOTIVATION -->

    <div class="motivation-box">

      <h2>
        Daily Reminder
      </h2>

      <p id="quoteText">
        Discipline beats motivation.
      </p>

    </div>

  </div>

  <!-- SCRIPT -->

  <script src="script.js"></script>

</body>

</html>
